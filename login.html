<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Pinguim - Conta</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <img id="img1" src="imgs/pinguim.png">

    <div id="caixinha">
        <h2>Conta</h2>
        <h2>Login/Criar</h2>

        <div id="secao-login">
            <form id="form-usuario">
                <input type="text" id="usuario-nome" class="input-jogo" placeholder="Nome de usuário" required autocomplete="off">
                <input type="password" id="usuario-senha" class="input-jogo" placeholder="Senha" required>
                
                <!-- Escolha de Avatar -->
                <div style="margin-bottom: 15px; text-align: left; background: rgba(255,255,255,0.6); padding: 10px; border-radius: 10px;">
                    <label style="font-size: 13px; font-weight: bold; color: var(--azul-escuro); display: block; margin-bottom: 8px;">Escolha seu Avatar:</label>
                    <div style="display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap;">
                        <label style="cursor: pointer; text-align: center; font-size: 12px;">
                            <input type="radio" name="avatar" value="imgs/pinguim.png" checked> 
                            <br><img src="imgs/pinguim.png" width="35" style="border-radius:50%; border: 1px solid #075985;">
                        </label>
                        <label style="cursor: pointer; text-align: center; font-size: 12px;">
                            <input type="radio" name="avatar" value="imgs/favicon.png"> 
                            <br><img src="imgs/favicon.png" width="35" style="border-radius:50%; border: 1px solid #075985;">
                        </label>
                        <!-- Opção de Upload de Imagem -->
                        <label style="cursor: pointer; text-align: center; font-size: 12px; display: flex; flex-direction: column; align-items: center;">
                            <input type="radio" name="avatar" id="radio-upload" value="upload">
                            <span style="font-size: 11px; color: #075985; font-weight: bold; margin-top: 2px;">Enviar Foto</span>
                            <input type="file" id="input-arquivo-avatar" accept="image/*" style="font-size: 10px; width: 90px; margin-top: 4px;">
                        </label>
                    </div>
                </div>

                <button type="submit" id="inicio">Entrar</button>
            </form>
            <p id="mensagem-alerta" style="margin-top: 12px; color: #075985; font-size: 14px; font-weight: bold;"></p>
        </div>

        <div id="secao-jogo" style="display: none;">
            <h3 id="saudacao" style="color: var(--azul-escuro); margin-bottom: 15px;"></h3>
            <button id="inicio" onclick="fazerLogout()">Sair da Conta</button>
        </div>

        <div style="margin-top: 15px;">
            <button id="voltar" onclick="window.location.href='index.html'">Voltar</button>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
