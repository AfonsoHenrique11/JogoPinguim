<!DOCTYPE html>
<html>
    <head>
    <title>Quiz Pinguinistico</title>
    <link rel="stylesheet" href="principal.css">
    <link rel="shortcut icon" href="imgs/Jogo Pinguim_ Aventura Gelada.png">
    <img src="imgs/Jogo Pinguim_ Aventura Gelada.png" alt="" id="img1">
</head>
    <body>
        <img src="imgs/pinguim.png" alt="" id="img1">
    <div id="caixinha">
            <h2>Olá, está preparado para sua aventura?</h2>
            <button id="inicio">Vamos Lá!</button>  
        </div>

        <div id="dificuldade">
            <h3>Escolha a dificuldade:</h3>
            <button id="facil">Fácil</button>
            <button id="normal">Normal</button>
            <button id="dificil">Difícil</button>
            <button id="impossivel">Impossível</button>
        </div>

        <button id="ranking">Ranking</button>
        <script>
        document.querySelector('#inicio').addEventListener('click', () => {
            document.querySelector("#dificuldade").style.display = "block";
            doucment.querySelector('#ranking').style.display = "none";
        });


        document.querySelector('#facil').addEventListener('click', () => {
            document.querySelector("#dificuldade").style.display = "none";
            localStorage.setItem('dificuldade', 0);
            location.href = "disfarcando.html";
        });
        document.querySelector('#normal').addEventListener('click', () => {
            document.querySelector("#dificuldade").style.display = "none";
            localStorage.setItem('dificuldade', 1);
            location.href = "disfarcando.html";
        });
        document.querySelector('#dificil').addEventListener('click', () => {
            document.querySelector("#dificuldade").style.display = "none";
            localStorage.setItem('dificuldade', 2);
            location.href = "disfarcando.html";
        });
        document.querySelector('#impossivel').addEventListener('click', () => {
            document.querySelector("#dificuldade").style.display = "none";
            localStorage.setItem('dificuldade', 3);
            location.href = "disfarcando.html";
        });

        document.querySelector('#ranking').addEventListener('click', () => {
            location.href = "ranking.html";
        });
        </script>
    </body>
</html>
