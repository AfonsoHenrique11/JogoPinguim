<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinguim Espião: Invasão</title>
    <link rel="stylesheet" href="Invasao.css">
     <link rel="shortcut icon" href="imgs/Pinguim Espião_ Logo Gamer Neon.png">
</head>
</head>
<body>
    <main id="invasao">
        <!-- DEBUG provisório (etapas 1 a 6): será removido quando o HUD estiver completo -->
        <p id="debug"></p>

        <div id="hud">
            <span>Alerta</span>
            <div id="barra-alerta"><div id="barra-alerta-nivel"></div></div>
        </div>
        <div id="hud-missao">
            <span id="hud-tempo">Tempo: 0:00</span>
            <span id="hud-cofres">Cofres: 0/0</span>
            <span id="hud-pendrive" class="hidden">Pendrive: sim</span>
            <span id="hud-codigo" class="hidden"></span>
        </div>

        <div id="palco">
            <canvas id="game" width="1024" height="640"></canvas>

            <!-- Painel numérico do cofre -->
            <div id="painel-cofre" class="hidden">
                <h3>Cofre</h3>
                <div id="painel-digitos"><span></span><span></span><span></span><span></span></div>
            </div>

            <!-- Tela de resultados: falha (pontuação 0, só "jogar de novo") ou vitória (pontuação, nickname e ranking) -->
            <div id="tela-resultado" class="hidden">
                <h2 id="resultado-titulo">Missão falhou</h2>
                <p id="resultado-pontuacao">Pontuação: 0</p>
                <p id="resultado-tempo" class="hidden"></p>
                <div id="grupo-ranking" class="hidden">
                    <label for="campo-nickname">Nickname</label>
                    <input id="campo-nickname" type="text" maxlength="12" autocomplete="off">
                </div>
                <div id="botoes-resultado">
                    <button id="botao-ranking" class="hidden" disabled>Ir ao ranking</button>
                    <button id="botao-jogar-de-novo">Jogar de novo</button>
                </div>
            </div>
        </div>
    </main>

    <script src="InvasaoMapas.js"></script>
    <script src="Invasao.js"></script>
</body>
</html>
