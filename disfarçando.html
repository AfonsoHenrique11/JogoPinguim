<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinguim Espião: Disfarce</title>
    <link rel="stylesheet" href="disfarçando.css">
</head>
<body>
    <section id="inicio">
        <h1>Hora de Infiltrar</h1>
        <h2>Mas um bom espião sempre tem bons dirfarces</h2>

        <p id="atencao">Preste atenção no alvo agente, não temos muito tempo!!</p>
        <button id="verAlvo">Ver o Alvo</button>
    </section>

    <section id="alvo">
        <img src="imgs/alvo.png" id="alvoimg">
    </section>

    <section id="disfarce">
        <h3>Hora de se trocar</h3>
            <div id="pinguim-container">
                <img src="imgs/pinguim.png" id="pinguim">

                <img id="chapeu-escolhido" class="vestimenta">
                <img src="imgs/camisa_floral.png" id="camisa-escolhida" class="vestimenta">
                <img id="cabelo-escolhido" class="vestimenta">
                <img id="colar-escolhido" class="vestimenta">
                <img id="oculos-escolhidos" class="vestimenta">
            </div>
         <section id="acessorios">
                <button>
                <img src="imgs/cartola.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/camiseta_preta.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/camisa_floral.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/peruca_loira.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/peruca_castanha.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/colar_perolas.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/colar_dourado.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/oculos_redondos.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/oculos_escuros.png" class="acessorio">
                </button>
                <button>
                <img src="imgs/chapeu_palha.png" class="acessorio">
                </button>
            </section>
    </section>
    <script src="disfarce.js"></script>
</body>
</html>
